[project]
name = "vektr-ops"
version = "0.1.0"
description = "Operations CLI for the Vektr64 Lichess bot"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "psutil>=5.9", "pyyaml>=6.0", "huggingface_hub>=0.26"]

[project.scripts]
vektr-ops = "vektr_ops.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vektr_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
