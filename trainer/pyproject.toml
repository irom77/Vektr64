[project]
name = "vektr-trainer"
version = "0.1.0"
description = "Trainer for the Vektr64 evaluation network"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "zstandard>=0.23", "torch>=2.4"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vektr_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
