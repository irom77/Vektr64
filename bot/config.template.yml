# lichess-bot settings for Vektr64. `vektr-ops play` fills in engine.dir, engine.name and
# the Hash size for the machine it runs on and writes the result to bot/config.yml.
# The real token is never stored here: the bridge reads it from LICHESS_BOT_TOKEN.
token: "xxxxxxxxxxxxxxxxxxxxxx"
url: "https://lichess.org/"

engine:
  dir: "FILLED_BY_VEKTR_OPS"
  name: "FILLED_BY_VEKTR_OPS"
  debug: false
  working_dir: ""
  protocol: "uci"
  ponder: false
  polyglot:
    enabled: false
  draw_or_resign:
    resign_enabled: false
    offer_draw_enabled: true
    offer_draw_score: 0
    offer_draw_for_egtb_zero: false
    offer_draw_moves: 10
    offer_draw_pieces: 10
  online_moves:
    max_out_of_book_moves: 10
    max_retries: 2
    chessdb_book:
      enabled: false
    lichess_cloud_analysis:
      enabled: false
    lichess_opening_explorer:
      enabled: false
    online_egtb:
      enabled: false
  lichess_bot_tbs:
    syzygy:
      enabled: false
    gaviota:
      enabled: false
  uci_options:
    Move Overhead: 300
    Threads: 1
    Hash: 64
  silence_stderr: false

abort_time: 30
fake_think_time: false
rate_limiting_delay: 0
# Milliseconds the bridge holds back from the clock it reports to the engine.
move_overhead: 500
max_takebacks_accepted: 0
quit_after_all_games_finish: false

correspondence:
  move_time: 60
  checkin_period: 300
  disconnect_time: 150
  ponder: false

challenge:
  concurrency: 1
  games_reserved_for_humans: 0
  sort_by: "best"
  preference: "none"
  accept_bot: true
  only_bot: true
  max_increment: 3
  min_increment: 2
  max_base: 300
  min_base: 180
  max_days: 14
  min_days: 1
  variants:
    - standard
  time_controls:
    - blitz
  modes:
    - rated
    - casual
  bullet_requires_increment: true
  max_simultaneous_games_per_user: 1

greeting:
  hello: "Hi! I'm {me}, an engine written from scratch that learns from its own games. Good luck!"
  goodbye: "Good game!"
  hello_spectators: "Hi! I'm {me}, an engine written from scratch that learns from its own games."
  goodbye_spectators: "Thanks for watching!"

# Paths are relative to bot/lichess-bot, where the bridge runs.
pgn_directory: "../game_records"
pgn_file_grouping: "game"

matchmaking:
  allow_matchmaking: true
  allow_during_games: false
  challenge_variant: "standard"
  # Minutes idle before the bot challenges someone. With blitz games of about eight
  # minutes this gives roughly 30 self-started games a day.
  challenge_timeout: 35
  challenge_initial_time:
    - 180
    - 300
  challenge_increment:
    - 2
    - 3
  opponent_rating_difference: 300
  rating_preference: "none"
  challenge_mode: "rated"
  challenge_filter: coarse
  include_challenge_block_list: false
